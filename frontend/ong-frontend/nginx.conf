server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache básico para assets
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
  }

  # SPA fallback (React Router): qualquer rota volta pro index.html
  location / {
    try_files $uri /index.html;
  }
}